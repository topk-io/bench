[workspace]
members = ["crates/core", "crates/py", "crates/js"]
resolver = "2"

# One binding per host language, over a shared driver. The bindings exist because a
# crate can only emit one cdylib, and Python and Node each need their own entry symbol.
[workspace.dependencies]
anyhow = "1.0.100"
arrow = "57.0.0"
arrow-array = "57.0.0"
arrow-schema = "57.0.0"
async-channel = "2.5.0"
async-trait = "0.1.83"
aws-config = "1.8.10"
aws-sdk-s3 = { version = "1.112.0", features = ["behavior-version-latest"] }
chrono = "0.4.42"
colored = "3.0.0"
config = "0.15.19"
hdrhistogram = "7.5.4"
once_cell = "1.21.3"
parquet = "57.0.0"
prost = "0.14.1"
rand = "0.9.2"
serde = "1.0.228"
serde_json = "1.0"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
topk-rs = { git = "ssh://git@github.com/topk-io/topk", package = "topk-rs" }
uuid = { version = "1.18.1", features = ["v4"] }
pyo3 = "0.23.3"
# Matched to topk-js so both addons load against the same napi ABI.
napi = { version = "3", default-features = false, features = ["napi5", "tokio_rt", "serde-json"] }
napi-derive = "3"
napi-build = "2"
